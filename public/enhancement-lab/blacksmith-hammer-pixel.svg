    <rect x="28" y="30" width="8" height="58" fill="#74451f"/>
    <rect x="28" y="34" width="3" height="48" fill="#a0642f"/>
    <rect x="33" y="34" width="3" height="48" fill="#513019"/>
    <!-- grip bands -->
    <rect x="26" y="52" width="12" height="5" fill="#3a2112"/>
    <rect x="26" y="70" width="12" height="5" fill="#3a2112"/>
    <rect x="26" y="84" width="12" height="6" fill="#1b120c"/>
    <!-- butt cap -->
    <rect x="24" y="88" width="16" height="6" fill="#15191b"/>
    <rect x="28" y="90" width="8" height="4" fill="#353b3c"/>
