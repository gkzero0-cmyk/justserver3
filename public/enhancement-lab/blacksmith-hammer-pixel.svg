<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96" shape-rendering="crispEdges">
  <g>
    <!-- steel head outline -->
    <rect x="4" y="6" width="56" height="20" fill="#15191b"/>
    <rect x="0" y="10" width="8" height="12" fill="#15191b"/>
    <rect x="56" y="10" width="8" height="12" fill="#15191b"/>
    <!-- head body -->
    <rect x="6" y="8" width="50" height="16" fill="#454d50"/>
    <rect x="2" y="12" width="10" height="8" fill="#596266"/>
    <rect x="52" y="12" width="10" height="8" fill="#303638"/>
    <!-- steel highlight/shadow pixels -->
    <rect x="8" y="8" width="36" height="4" fill="#7a8588"/>
    <rect x="12" y="12" width="32" height="4" fill="#626d70"/>
    <rect x="8" y="20" width="44" height="4" fill="#292f31"/>
    <rect x="48" y="8" width="8" height="4" fill="#596164"/>
    <!-- eye/collar -->
    <rect x="25" y="20" width="14" height="10" fill="#171b1c"/>
    <rect x="27" y="22" width="10" height="8" fill="#33393a"/>
    <!-- handle outline -->
    <rect x="26" y="28" width="12" height="62" fill="#26160d"/>
    <rect x="24" y="34" width="4" height="48" fill="#26160d"/>
    <rect x="36" y="34" width="4" height="48" fill="#26160d"/>
