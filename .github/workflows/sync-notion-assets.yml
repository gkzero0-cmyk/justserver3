name: Sync Notion assets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/cache-notion-assets.mjs'
      - 'scripts/optimize-notion-assets.mjs'
      - 'lib/notion-index.ts'
      - 'components/notion-document.tsx'
      - '.github/workflows/sync-notion-assets.yml'

permissions:
  contents: write

concurrency:
  group: notion-asset-sync
  cancel-in-progress: true

jobs:
  sync:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Notion images
        run: npm run sync:notion-assets

      - name: Detect Notion source changes
        id: notion_diff
        shell: bash
        run: |
          # cache-notion-assets rewrites index.json without the derived
          # thumbnail/hero fields that optimize-notion-assets restores later.
          # Ignore that transient index-only diff; manifest/search-index/image
          # changes still trigger the full optimization path.
          if git diff --quiet -- \
            public/notion-assets \
            ':(exclude)public/notion-assets/index.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful Notion source changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful Notion source changes detected:"
            git diff --name-only -- \
              public/notion-assets \
              ':(exclude)public/notion-assets/index.json'
          fi

      - name: Optimize display images
        if: github.event_name != 'schedule' || steps.notion_diff.outputs.changed == 'true'
        run: npm run optimize:notion-assets

      - name: Skip unchanged scheduled optimization
        if: github.event_name == 'schedule' && steps.notion_diff.outputs.changed != 'true'
        run: echo "Scheduled sync found no Notion changes; skipping Sharp optimization and commit work."

      - name: Commit refreshed assets
        if: github.event_name != 'schedule' || steps.notion_diff.outputs.changed == 'true'
        run: |
          rm -rf /tmp/notion-assets
          cp -a public/notion-assets /tmp/notion-assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Sync commit attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            rm -rf public/notion-assets
            mkdir -p public
            cp -a /tmp/notion-assets public/notion-assets

            git add public/notion-assets
            if git diff --cached --quiet; then
              echo "No Notion asset changes."
              exit 0
            fi

            git commit -m "Sync Notion image assets"

            if git push origin HEAD:main; then
              echo "Notion assets pushed successfully."
              exit 0
            fi

            echo "Main changed during sync; retrying against the latest commit."
            sleep 2
          done

          echo "Unable to push refreshed Notion assets after 3 attempts."
          exit 1

