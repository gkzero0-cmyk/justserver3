name: Sync Notion assets

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/cache-notion-assets.mjs'
      - 'lib/notion-assets.ts'
      - 'components/notion-document.tsx'
      - 'package.json'
      - '.github/workflows/sync-notion-assets.yml'

permissions:
  contents: write

concurrency:
  group: notion-asset-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Download Notion images
        run: npm run sync:notion-assets

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/notion-assets
          if git diff --cached --quiet; then
            echo "No Notion asset changes."
          else
            git commit -m "Sync Notion image assets"
            git push
          fi
