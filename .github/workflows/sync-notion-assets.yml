name: Sync Notion assets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/cache-notion-assets.mjs'
      - 'scripts/optimize-notion-assets.mjs'
      - 'lib/notion-index.ts'
      - 'components/notion-document.tsx'
      - '.github/workflows/sync-notion-assets.yml'

permissions:
  contents: write

concurrency:
  group: notion-asset-sync
  cancel-in-progress: true

jobs:
  sync:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Notion images
        run: npm run sync:notion-assets

      - name: Optimize display images
        run: npm run optimize:notion-assets

      - name: Commit refreshed assets
        run: |
          rm -rf /tmp/notion-assets
          cp -a public/notion-assets /tmp/notion-assets

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Sync commit attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            rm -rf public/notion-assets
            mkdir -p public
            cp -a /tmp/notion-assets public/notion-assets

            git add public/notion-assets
            if git diff --cached --quiet; then
              echo "No Notion asset changes."
              exit 0
            fi

            git commit -m "Sync Notion image assets"

            if git push origin HEAD:main; then
              echo "Notion assets pushed successfully."
              exit 0
            fi

            echo "Main changed during sync; retrying against the latest commit."
            sleep 2
          done

          echo "Unable to push refreshed Notion assets after 3 attempts."
          exit 1

