name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/e2e.yml'
      - 'tests/e2e/**'
      - 'playwright.config.js'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/enhancement-lab/**'
      - 'vercel.json'
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      base_url:
        description: URL to verify
        required: false
        default: https://justserver3.vercel.app

permissions:
  contents: read

concurrency:
  group: wiki-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WIKI_E2E_BASE_URL: ${{ inputs.base_url || 'https://justserver3.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npx playwright test
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
