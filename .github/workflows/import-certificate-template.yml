name: Import certificate template

on:
  push:
    paths:
      - '.github/workflows/import-certificate-template.yml'

permissions:
  contents: write

jobs:
  import-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch high-resolution certificate template
        env:
          SHARE_URL: https://firestorage.ai/ja/f/ub6vf1MnN--V
        run: |
          node <<'NODE'
          const fs = require('fs')
          const { URL } = require('url')

          const shareUrl = process.env.SHARE_URL
          const headers = { 'user-agent': 'Mozilla/5.0 certificate-template-import/1.0' }

          function addCandidate(set, raw, base) {
            if (!raw) return
            raw = raw.replaceAll('\\/','/').replaceAll('&amp;','&')
            if (/^(data:|javascript:|mailto:|#)/i.test(raw)) return
            try { set.add(new URL(raw, base).href) } catch {}
          }

          function sniff(bytes, type = '') {
            if (type.startsWith('image/')) return true
            if (bytes.length > 12 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return true
            if (bytes.length > 12 && bytes[0] === 0xff && bytes[1] === 0xd8) return true
            if (bytes.length > 12 && bytes.subarray(0,4).toString() === 'RIFF' && bytes.subarray(8,12).toString() === 'WEBP') return true
            return false
          }

          async function fetchBuffer(url) {
            const response = await fetch(url, { headers, redirect: 'follow' })
            const type = (response.headers.get('content-type') || '').toLowerCase()
            const bytes = Buffer.from(await response.arrayBuffer())
            return { response, type, bytes }
          }

          ;(async () => {
            const page = await fetch(shareUrl, { headers, redirect: 'follow' })
            if (!page.ok) throw new Error(`share page HTTP ${page.status}`)
            const html = await page.text()
            const candidates = new Set()

            for (const match of html.matchAll(/(?:href|src|content|downloadUrl|download_url|fileUrl|file_url)\s*[:=]\s*["']([^"']+)["']/gi)) {
              addCandidate(candidates, match[1], page.url)
            }
            for (const match of html.matchAll(/https?:\\?\/\\?\/[^"'<>\\s]+/gi)) {
              addCandidate(candidates, match[0], page.url)
            }

            // Also inspect likely JSON/API links embedded in the page.
            const apiCandidates = [...candidates].filter(u => /api|share|file|download|object|asset/i.test(u))
            for (const url of apiCandidates.slice(0, 80)) {
              try {
                const r = await fetch(url, { headers, redirect: 'follow' })
                const type = (r.headers.get('content-type') || '').toLowerCase()
                if (type.includes('json')) {
                  const text = await r.text()
                  for (const m of text.matchAll(/https?:\\?\/\\?\/[^"'<>s]+/gi)) addCandidate(candidates, m[0], url)
                }
              } catch {}
            }

            let best = null
            for (const url of [...candidates].slice(0, 180)) {
              try {
                const { response, type, bytes } = await fetchBuffer(url)
                if (!response.ok || !sniff(bytes, type)) continue
                if (!best || bytes.length > best.bytes.length) best = { url: response.url, type, bytes }
              } catch {}
            }

            if (!best || best.bytes.length < 200000) {
              console.error('No direct image candidate found; extracting Firestorage network routes.')
              const scriptUrls = [...candidates].filter(u => u.includes('/_next/static/chunks/') && u.endsWith('.js'))
              const routes = new Set()
              const snippets = []
              for (const scriptUrl of scriptUrls.slice(0, 40)) {
                try {
                  const js = await (await fetch(scriptUrl, { headers })).text()
                  for (const m of js.matchAll(/["'`](\\?\/api\\?\/[^"'\x60\\s]{1,220})["'`]/g)) {
                    routes.add(m[1].replaceAll('\\\\/','/'))
                  }
                  for (const m of js.matchAll(/["'`](\/[^"'\x60\\s]{0,100}(?:download|share|file|object|presign|signed)[^"'\x60\\s]{0,120})["'`]/gi)) {
                    const route = m[1]
                    if (!route.includes('_next/') && !route.includes('.css')) routes.add(route)
                  }
                  for (const needle of ['fetch(','axios','shareId','publicId','downloadUrl','signedUrl','presign']) {
                    let at = 0
                    while ((at = js.indexOf(needle, at)) >= 0 && snippets.length < 120) {
                      const snippet = js.slice(Math.max(0, at - 180), Math.min(js.length, at + 360))
                      if (!/file-download-preparing_[A-Za-z0-9_]/.test(snippet) || needle !== 'download') snippets.push(snippet)
                      at += needle.length
                    }
                  }
                } catch {}
              }
              console.error('ROUTES_BEGIN')
              console.error([...routes].sort().join('\n'))
              console.error('ROUTES_END')
              console.error('NETWORK_SNIPPETS_BEGIN')
              console.error(snippets.slice(0, 120).join('\n---\n'))
              console.error('NETWORK_SNIPPETS_END')
              process.exit(2)
            }

            const ext = best.type.includes('webp') || best.bytes.subarray(8,12).toString() === 'WEBP' ? 'webp'
              : best.type.includes('jpeg') || best.bytes[0] === 0xff ? 'jpg'
              : 'png'
            fs.mkdirSync('public/certificate-template', { recursive: true })
            fs.writeFileSync(`public/certificate-template/master.${ext}`, best.bytes)
            fs.writeFileSync('public/certificate-template/source.txt', best.url + '\n')
            console.log('Imported', best.url, best.type, best.bytes.length, 'bytes')
          })().catch(error => { console.error(error); process.exit(1) })
          NODE

      - name: Commit template asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/certificate-template
          if git diff --cached --quiet; then
            echo "Template already current"
            exit 0
          fi
          git commit -m "assets: import high-resolution certificate template [skip vercel]"
          git push origin HEAD:main
