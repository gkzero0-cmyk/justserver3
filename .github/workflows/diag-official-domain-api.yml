name: Diagnose official wiki API domain

on:
  push:
    branches: [diag/official-domain-api-20261001]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect embedded official wiki data
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://server1.wiki.xn--9i1bk7xhlfi8hzzf.com'
          curl -sS -L --connect-timeout 8 --max-time 20 -o /tmp/root.html "$BASE/"
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/root.html').read_text(errors='replace')
          print('HTML_BYTES',len(text))
          for needle in ['채광','낚시','서버규칙','많이 물어보는 것','const docs','let docs','docs=','pages=','sections','searchText','doc-1']:
              print('\n===',needle,'===')
              start=0; shown=0
              while shown<3:
                  i=text.find(needle,start)
                  if i<0: break
                  lo=max(0,i-450); hi=min(len(text),i+950)
                  print(text[lo:hi].replace('\n',' ')[:1400])
                  start=i+len(needle); shown+=1
          print('\n=== INLINE SCRIPT PREFIXES ===')
          import re
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',text,re.I)
          for idx,s in enumerate(scripts):
              if any(k in s for k in ['채광','서버규칙','doc-1','searchText']):
                  print('SCRIPT',idx,'LEN',len(s),s[:3000].replace('\n',' '))
          PY
