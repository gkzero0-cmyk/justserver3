name: Diagnose official wiki API domain

on:
  push:
    branches: [diag/official-domain-api-20261001]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect official content API
        shell: bash
        run: |
          set -euo pipefail
          URL='https://server1.wiki.xn--9i1bk7xhlfi8hzzf.com/api/content'
          curl -sS -L --connect-timeout 8 --max-time 20 -D /tmp/headers.txt -o /tmp/content.json -w 'HTTP=%{http_code} URL=%{url_effective}\n' "$URL"
          cat /tmp/headers.txt | head -n 30
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/content.json').read_text(errors='replace')
          print('BYTES',len(raw))
          data=json.loads(raw)
          print('TOP_KEYS',sorted(data.keys()))
          wiki=data.get('wiki') or {}
          print('WIKI_KEYS',sorted(wiki.keys()))
          pages=wiki.get('pages') or []
          print('PAGE_COUNT',len(pages))
          for p in pages[:12]:
              print('PAGE',p.get('title'),p.get('category'),'blocks',len(p.get('blocks') or []),'deleted',p.get('deleted'))
              if p.get('title') in {'채광','낚시','서버규칙','사냥','요리'}:
                  print(json.dumps(p,ensure_ascii=False)[:3500])
          print('HAS_NOTION_URL', 'notion.so' in raw or 'app.notion.com' in raw)
          print('HAS_JUSTSERVER3_VERCEL', 'justserver3.vercel.app' in raw)
          PY
