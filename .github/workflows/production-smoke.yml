name: Production Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[production smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify live production identity
        run: |
          node - <<'NODE'
          const response = await fetch('https://justserver3.vercel.app/api/version', {
            headers: { 'cache-control': 'no-cache' }
          })
          if (!response.ok) {
            throw new Error(`Production version endpoint returned HTTP ${response.status}`)
          }
          const body = await response.json()
          if (!body.commit || body.environment !== 'production') {
            throw new Error(`Unexpected production identity: ${JSON.stringify(body)}`)
          }
          console.log(`Production commit: ${body.commit}`)
          NODE
      - name: Run read-only production smoke checks
        run: npm run test:production
