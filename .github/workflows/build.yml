name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit CSS readability debt
        run: npm run audit:css
      - name: Audit runtime configuration and markup
        run: npm run audit:static

      - name: Verify current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:deploy-bundle

      - name: Preflight summary
        if: always()
        run: |
          {
            echo "## Pre-production gate"
            echo
            echo "- Unit tests: completed in build"
            echo "- Repository integrity: completed in build"
            echo "- Search index integrity: completed in repository integrity"
            echo "- Sitemap/robots contract: covered by unit tests"
            echo "- CSS regression baseline: checked"
            echo "- Image/markup regression baseline: checked"
            echo "- Sensitive tracked files: checked"
            echo "- Static internal links: checked"
            echo "- Deploy bundle: generated ephemerally, source-matched, and SHA-256 fingerprinted on main push"
            echo
            echo "Production deployment is intentionally separate from this gate."
          } >> "$GITHUB_STEP_SUMMARY"

