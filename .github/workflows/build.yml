name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      - name: Build current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build-deploy-bundle.mjs

      - name: Store current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "A newer main commit exists; its workflow will refresh the deploy bundle."
            exit 0
          fi

          git add .deploy/current.json
          if git diff --cached --quiet; then
            echo "Deploy bundle is already current."
          else
            git commit -m "Refresh deploy bundle [skip ci]"
            git push
          fi

      - name: Deploy production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_h8qoVPaBVDEj8uuWhcVJIhtn
          VERCEL_PROJECT_ID: prj_baolCn3gBLeW4o8DS7ZNeA96mg8k
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Vercel production refresh requested through deploy hook."
          elif [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploy hook is not configured; using Vercel CLI fallback."
            npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            echo "::warning::No Vercel deployment credential is configured."
            echo "::warning::Set VERCEL_DEPLOY_HOOK or VERCEL_TOKEN in GitHub Actions secrets."
            echo "Build is valid, but production deployment cannot be triggered from GitHub yet."
          fi
