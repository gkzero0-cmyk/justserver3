name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      - name: Build current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build-deploy-bundle.mjs

      - name: Store current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "A newer main commit exists; its workflow will refresh the deploy bundle."
            exit 0
          fi

          git add .deploy/current.json
          if git diff --cached --quiet; then
            echo "Deploy bundle is already current."
          else
            git commit -m "Refresh deploy bundle [skip ci]"
            git push
          fi

      - name: Trigger Vercel production refresh when configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
            echo "Vercel production refresh requested."
          else
            echo "VERCEL_DEPLOY_HOOK is not configured; relying on Vercel Git integration."
          fi
