name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      - name: Build current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/build-deploy-bundle.mjs

      - name: Verify production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LOCAL_SHA="$(git rev-parse HEAD)"
          DEPLOYED_SHA=""

          for attempt in $(seq 1 90); do
            DEPLOYED_SHA="$(
              curl --fail --silent --show-error                 -H 'cache-control: no-cache'                 "https://justserver3.vercel.app/api/version?ts=$(date +%s)"               | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(JSON.parse(d).commit||'')}catch{}})"
            )" || true

            if [ "$DEPLOYED_SHA" = "$LOCAL_SHA" ]; then
              echo "Production now serves commit $LOCAL_SHA."
              break
            fi

            echo "Production is still on ${DEPLOYED_SHA:-unknown}; checking again."
            sleep 10
          done

          if [ "$DEPLOYED_SHA" != "$LOCAL_SHA" ]; then
            echo "::error::Production did not advance to commit $LOCAL_SHA."
            exit 1
          fi

          npm run test:production

      - name: Store current deploy bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REMOTE_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "A newer main commit exists; its workflow will refresh the deploy bundle."
            exit 0
          fi

          git add .deploy/current.json
          if git diff --cached --quiet; then
            echo "Deploy bundle is already current."
          else
            git commit -m "Refresh deploy bundle [skip ci]"
            git push
          fi
